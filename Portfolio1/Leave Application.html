<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Application Form</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
            border-top: 5px solid #3b82f6;
        }
        h2 {
            text-align: center;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 700;
        }
        p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            color: #1e293b;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .other-input {
            margin-top: 12px;
            display: none;
        }
        button {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
    <script>
        function toggleOtherReason() {
            var reasonSelect = document.getElementById("reason");
            var otherInputDiv = document.getElementById("other-reason-div");
            var otherInput = document.getElementById("other_reason");
            
            if (reasonSelect.value === "Other") {
                otherInputDiv.style.display = "block";
                otherInput.setAttribute("required", "required");
            } else {
                otherInputDiv.style.display = "none";
                otherInput.removeAttribute("required");
            }
        }
    </script>
</head>
<body>

<div class="form-card">
    <h2>Leave Application Form</h2>
    <p class="subtitle">Please fill in the details below to request leave</p>
    
    <!-- CHANGE 1: Action URL changed to Web3Forms API -->
    <form action="https://api.web3forms.com/submit" method="POST">
        
        <!-- CHANGE 2: Put your Web3Forms Access Key here -->
        <input type="hidden" name="access_key" value="884a22bd-22bb-4a5e-b270-8a64aa3b5cca">
        
        <!-- Name Field -->
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="full_name" placeholder="Enter your full name" required>
        </div>

        <!-- Course Field -->
        <div class="form-group">
            <label for="course">Course</label>
            <select id="course" name="course" required>
                <option value="" disabled selected>Select your course</option>
                <option value="B.Tech">B.Tech</option>
                <option value="BCA">BCA</option>
                <option value="B.Sc">B.Sc</option>
                <option value="BBA">BBA</option>
                <option value="MBA">MBA</option>
                <option value="M.Tech">M.Tech</option>
            </select>
        </div>

        <!-- Branch Field -->
        <div class="form-group">
            <label for="branch">Branch / Stream</label>
            <select id="branch" name="branch" required>
                <option value="" disabled selected>Select your branch</option>
                <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electronics & Communication">Electronics & Communication</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
                <option value="Management Studies">Management Studies</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Reason Field -->
        <div class="form-group">
            <label for="reason">Reason for Leave</label>
            <select id="reason" name="leave_reason" onchange="toggleOtherReason()" required>
                <option value="" disabled selected>Select reason for leave</option>
                <option value="Medical / Sick Leave">Medical / Sick Leave</option>
                <option value="Family Function / Wedding">Family Function / Wedding</option>
                <option value="Urgent Personal Work">Urgent Personal Work</option>
                <option value="Out of Station Travel">Out of Station Travel</option>
                <option value="Exam Preparation">Exam Preparation</option>
                <option value="Other">Other (Specify below)</option>
            </select>
        </div>

        <!-- Hidden Input for 'Other' Reason -->
        <div class="form-group other-input" id="other-reason-div">
            <label for="other_reason">Please specify your reason</label>
            <textarea id="other_reason" name="other_reason" placeholder="Write your specific reason here..."></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit">Submit Application</button>
        
    </form>
</div>

</body>
</html>
